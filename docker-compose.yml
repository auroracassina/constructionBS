services:
  cactus:
    stdin_open: true
    tty: true
    build:
      context: ./
      dockerfile: Dockerfiles/Cactus/Dockerfile
    volumes:
    - type: bind
      source: ./results
      target: /results
    - type: bind
      source: ./input_data
      target: /input_data
    command:
    - /bin/bash
    - -c
    - mkdir -p /results && cactus --help > /results/cactus_help.txt 2>&1
  minigraph:
    stdin_open: true
    tty: true
    build:
      context: ./
      dockerfile: Dockerfiles/Minigraph/Dockerfile
    volumes:
    - type: bind
      source: ./results
      target: /results
    - type: bind
      source: ./input_data
      target: /input_data
    command:
    - /bin/bash
    - -c
    - mkdir -p /results && cd /minigraph && ./minigraph > /results/minigraph_help.txt
      2>&1 || true
  minigraphcactus:
    stdin_open: true
    tty: true
    build:
      context: ./
      dockerfile: Dockerfiles/MinigraphCactus/Dockerfile
